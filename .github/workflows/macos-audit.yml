name: Audit released Mac downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit-mac-download.py ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-download-audit-${{ matrix.arch }}
          path: audit-*.json
